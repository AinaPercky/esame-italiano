<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esercizio 6 – Verbi riflessivi</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#17243a;--mut:#62728a;--pri:#1f4e8c;--pri-t:#fff;--chip:#e7eef9;--ok:#1a7a45;--okb:#e1f4e9;--ko:#b3261e;--kob:#fbe6e4;--bd:#d3dbe8;--sh:0 2px 8px rgba(20,40,80,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#18212e;--tx:#e8edf5;--mut:#9aa8bd;--pri:#6ea4ee;--pri-t:#0b1626;--chip:#25324a;--ok:#62d08f;--okb:#17332a;--ko:#ff8a80;--kob:#3a1c1a;--bd:#33425b;--sh:none}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#18212e;--tx:#e8edf5;--mut:#9aa8bd;--pri:#6ea4ee;--pri-t:#0b1626;--chip:#25324a;--ok:#62d08f;--okb:#17332a;--ko:#ff8a80;--kob:#3a1c1a;--bd:#33425b;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-color:var(--bg)}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--bd)}
.in{max-width:640px;margin:0 auto}
h1{font-size:1.05rem;margin:0}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mut);margin:2px 0 6px}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.bankw{margin-top:10px}
.bankt{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.sel{background:var(--pri);color:var(--pri-t);border-color:var(--pri);padding:4px 10px;font-size:.98rem}
.done{color:var(--ok);font-weight:600;padding:10px 0}
main{padding:14px 16px 150px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);transition:border-color .2s}
.card.active{border-color:var(--pri)}
.card.ok{border-color:var(--ok)}.card.ko{border-color:var(--ko)}
.sent{font-size:1.08rem;line-height:2.1}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--pri);font-weight:700;font-size:.85rem;align-items:center;justify-content:center;margin-right:8px}
.slot{display:inline-block;min-width:110px;border-bottom:2px dashed var(--pri);text-align:center;color:var(--mut);cursor:pointer;border-radius:6px 6px 0 0}
.card.active .slot{background:var(--chip);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.55}}
.row{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.row label{font-size:.8rem;color:var(--mut)}
input{width:100%;font-size:1.05rem;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
input:focus{outline:0;border-color:var(--pri)}
.fb{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:.92rem}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.ko{background:var(--kob);color:var(--ko)}
.res{text-align:center}
.big{font-size:2.2rem;font-weight:800;color:var(--pri)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.acc{display:none;gap:6px;margin-bottom:8px}
.acc.on{display:flex}
.acc button{flex:1;padding:9px 0;font-size:1.1rem;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:12px;border:0;font-size:1rem;font-weight:700;cursor:pointer;background:var(--pri);color:var(--pri-t)}
.btn.sec{background:var(--chip);color:var(--tx);flex:.6}
.btn:disabled{opacity:.45}
.tip{font-size:.8rem;color:var(--mut);text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<header><div class="in">
<h1>Esercizio 6 – Verbi riflessivi e presente</h1>
<div class="meta"><span id="m1"></span><span id="m2"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="bankw"><div class="bankt">Banca dei verbi · utilise chaque verbe une fois</div><div class="bank" id="bank"></div></div>
</div></header>
<main><div class="in" id="list"></div></main>
<footer><div class="in">
<div class="acc" id="acc"></div>
<div class="tip" id="tip"></div>
<div class="btns"><button class="btn sec" id="reset">Recommencer</button><button class="btn" id="check" disabled>Corriger</button></div>
</div></footer>
<script>
var ITEMS=[
{id:1,a:"Quando sono molto stanco, io ",b:" subito.",v:"addormentarsi",r:["mi addormento"]},
{id:2,a:"Le mie amiche ",b:" sempre molto alle feste.",v:"divertirsi",r:["si divertono"]},
{id:3,a:"Voi due ",b:" Esposito, vero?",v:"chiamarsi",r:["vi chiamate"]},
{id:4,a:"Noi ",b:" troppo caffè la mattina.",v:"bere",r:["beviamo"]},
{id:5,a:"Tu non ",b:" mai la verità!",v:"dire",r:["dici"]}
];
var VERBES=["bere","chiamarsi","dire","addormentarsi","divertirsi"];
var choix={},saisies={},active=1,corrige=false,last=null;
var $=function(i){return document.getElementById(i)};
function norm(t){return (t||"").trim().toLowerCase().replace(/\s+/g," ")}
function placed(){return ITEMS.filter(function(i){return choix[i.id]}).length}
function conj(){return ITEMS.filter(function(i){return norm(saisies[i.id])}).length}
function ptsV(i){return choix[i.id]===i.v?1:0}
function ptsC(i){return i.r.map(norm).indexOf(norm(saisies[i.id]))>=0?2:0}
function nextEmpty(){var f=ITEMS.filter(function(i){return !choix[i.id]})[0];return f?f.id:null}

function choisir(v){
  var t=choix[active]?nextEmpty():active;
  if(!t)return;
  choix[t]=v;active=t;render();
  var e=document.querySelector('input[data-id="'+t+'"]');if(e)e.focus({preventScroll:false});
}
function rendre(id){choix[id]=null;saisies[id]="";active=id;render()}

function render(){
  var u=Object.keys(choix).map(function(k){return choix[k]});
  var h="";
  VERBES.forEach(function(v){if(u.indexOf(v)<0)h+='<button class="chip" data-v="'+v+'">'+v+'</button>'});
  $("bank").innerHTML=h||'<div class="done">✓ Tous les verbes sont placés</div>';
  $("bank").querySelectorAll(".chip").forEach(function(c){c.onclick=function(){if(!corrige)choisir(c.dataset.v)}});
  var l="";
  ITEMS.forEach(function(i){
    var c=choix[i.id],cls="card"+(active===i.id&&!corrige?" active":"");
    if(corrige)cls+=(ptsV(i)+ptsC(i)===3?" ok":" ko");
    l+='<div class="'+cls+'" data-card="'+i.id+'"><div class="sent"><span class="num">'+i.id+'</span>'+i.a;
    l+=c?'<button class="chip sel" data-r="'+i.id+'">'+c+(corrige?'':' ✕')+'</button>':'<span class="slot" data-s="'+i.id+'">touche un verbe</span>';
    l+=i.b+'</div>';
    if(c)l+='<div class="row"><label>Conjugue « '+c+' » avec le sujet de la phrase</label><input data-id="'+i.id+'" value="'+(saisies[i.id]||"").replace(/"/g,"&quot;")+'" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"'+(corrige?' disabled':'')+'></div>';
    if(corrige){var p=ptsV(i)+ptsC(i);l+='<div class="fb '+(p===3?'ok':'ko')+'">'+(p===3?'✔ ':'✘ ')+p+'/3'+(p===3?'':' — Réponse : <strong>'+i.v+' → '+i.r[0]+'</strong>')+'</div>'}
    l+='</div>';
  });
  $("list").innerHTML=l;
  $("list").querySelectorAll("[data-r]").forEach(function(e){e.onclick=function(ev){ev.stopPropagation();if(!corrige)rendre(+e.dataset.r)}});
  $("list").querySelectorAll("[data-card]").forEach(function(e){e.onclick=function(){if(!corrige&&!choix[+e.dataset.card]){active=+e.dataset.card;render()}}});
  $("list").querySelectorAll("input").forEach(function(e){
    e.oninput=function(){saisies[+e.dataset.id]=e.value;stat()};
    e.onfocus=function(){last=e;active=+e.dataset.id;$("acc").classList.add("on")};
    e.onkeydown=function(ev){if(ev.key==="Enter"){ev.preventDefault();var n=ITEMS.filter(function(i){return !choix[i.id]})[0];if(n){active=n.id;render()}else e.blur()}};
  });
  stat();
}
function stat(){
  var p=placed(),c=conj();
  $("m1").textContent="Verbes placés : "+p+"/"+ITEMS.length;
  $("m2").textContent="Conjugués : "+c+"/"+ITEMS.length;
  $("pb").style.width=((p+c)/(2*ITEMS.length)*100)+"%";
  $("check").disabled=corrige||p<ITEMS.length;
  $("tip").textContent=corrige?"":(p<ITEMS.length?"Place les "+ITEMS.length+" verbes pour pouvoir corriger":"Tout est placé. Vérifie tes conjugaisons.");
}
["à","è","é","ì","ò","ù"].forEach(function(ch){
  var b=document.createElement("button");b.textContent=ch;
  b.onmousedown=function(e){e.preventDefault()};
  b.onclick=function(){if(!last||last.disabled)return;last.value+=ch;saisies[+last.dataset.id]=last.value;last.focus();stat()};
  $("acc").appendChild(b);
});
$("check").onclick=function(){
  corrige=true;$("acc").classList.remove("on");render();
  var t=ITEMS.reduce(function(s,i){return s+ptsV(i)+ptsC(i)},0);
  var m=t>=12?"Excellent !":t>=8?"Bien, continue !":"À retravailler";
  var d=document.createElement("div");d.className="card res";
  d.innerHTML='<div class="big">'+t+' / 15</div><div>'+m+'</div>';
  $("list").insertBefore(d,$("list").firstChild);
  window.scrollTo({top:0,behavior:"smooth"});
};
$("reset").onclick=function(){choix={};saisies={};active=1;corrige=false;last=null;$("acc").classList.remove("on");render();window.scrollTo({top:0,behavior:"smooth"})};
render();
</script>
</body>
</html>
