name: Quiz regression tests

on:
  push:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'package.json'
      - '.github/workflows/quiz-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'package.json'
      - '.github/workflows/quiz-regression.yml'

jobs:
  quiz-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perckylingua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perckylingua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and integration tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
      - name: Test quiz snapshot migration in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: perckylingua_test
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/quiz_submission_questions_snapshot_migration.sql
      - name: Bootstrap minimal schema for public quiz batch grading
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: perckylingua_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/public_quiz_batch_ci_bootstrap.sql
      - name: Apply public quiz batch grading migration
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: perckylingua_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120190000_batch_public_quiz_grading.sql
      - name: Test public quiz batch grading, privacy and RPC grants
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: perckylingua_test
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/public_quiz_batch_grading.sql
