name: Quiz regression tests

on:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/quiz-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/quiz-regression.yml'

jobs:
  quiz-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and integration tests
        run: npm test
      - name: TypeScript validation
        run: npm run lint
