name: Quiz snapshot migration CI

on:
  pull_request:
    paths:
      - "supabase/migrations/20261120150000_add_quiz_submission_questions_snapshot.sql"
      - "tests/sql/quiz_submission_questions_snapshot_migration.sql"
      - ".github/workflows/quiz-snapshot-migration-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-snapshot-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perckylingua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perckylingua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run migration integration test
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: perckylingua_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/quiz_submission_questions_snapshot_migration.sql
