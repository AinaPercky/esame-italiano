name: Written exams CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [feat/written-composite-exams]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: written_exam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d written_exam_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: written_exam_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap minimal application schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_ci_bootstrap.sql
      - name: Apply written exam migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261108000000_composite_written_exams.sql
      - name: Apply verb-bank question migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109000000_verbes_trous_written_exams.sql
      - name: Apply per-question timer and anti-cheat migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110000000_written_exam_question_timers.sql
      - name: Fix atomic written-exam answer saving and early validation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110030000_fix_written_exam_early_answer_saving.sql
      - name: Apply PostgreSQL compatibility fix for time-limit RPC
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261111000000_fix_written_exam_time_limit_count.sql
      - name: Apply written exam attempt reset RPC migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261112000000_reset_written_exam_attempts.sql
      - name: Clarify instructions in existing draft exams
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261113000000_clarify_existing_draft_exam_prompts.sql
      - name: Include manual-review state in student corrections
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114000000_include_manual_review_in_student_corrections.sql
      - name: Add manual written-expression grading
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261115000000_manual_written_expression_score.sql
      - name: Enforce written-exam anti-cheat disqualification
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261116000000_written_exam_integrity_disqualification.sql
      - name: Enable hybrid automatic and manual grading
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261117000000_hybrid_written_exam_grading.sql
      - name: Verify schema and RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_schema_smoke.sql
      - name: Test complete exam lifecycle and student isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_flow.sql
      - name: Test manual expression-writing score and publication guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_expression_score.sql
      - name: Test written-exam anti-cheat disqualification and teacher expression mark
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_integrity_disqualification.sql
      - name: Test hybrid automatic and manual question grading
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/written_exam_hybrid_grading.sql
